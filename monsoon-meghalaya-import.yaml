  itinerary:
    - day: 1
      title: Journey to a Hidden Hill Town
      description: >
        Depart Guwahati at 7 AM and drive into the misty green hills of
        Meghalaya. Stop for breakfast on the way and stock up on snacks for
        the drive. Arrive at a serene, offbeat village dotted with tiny lakes
        and rolling meadows. Settle into the hillside homestay, have lunch,
        and enjoy a slow evening by the meadows. Bond with fellow travellers
        around the bonfire, then wind down with a quiet homely dinner.
      stay: Offbeat hill village (homestay)
      meals:
        - D
      transport: Force Traveller from Guwahati

    - day: 2
      title: Split Rocks & Jungle Camping
      description: >
        After breakfast, drive to Mawlyngbna — a lesser-known forest region
        known for its strange rock formations and wild energy. Hike to Split
        Rock, a short but exciting trail leading to a massive crack in the
        earth you can walk through. Post-lunch, set up camp in the jungle.
        Spend the evening with bonfire chats, card games, and the comfort of
        shared silence as mist rolls in.
      stay: Jungle tent camp, Mawlyngbna
      meals:
        - B
        - D
      transport: Force Traveller

    - day: 3
      title: Cliff Jumps & Canyons
      description: >
        A half-day river canyoning session — swimming, cliff jumping,
        waterfall sliding, and kayaking in pure monsoon madness. After lunch
        and a slow wind-down, drive to Sohra (Cherrapunji) and check in for a
        well-earned rest ahead of the big waterfall day.
      stay: Guesthouse, Sohra (Cherrapunji)
      meals:
        - B
      transport: Force Traveller

    - day: 4
      title: Chasing Waterfalls
      description: >
        Wake up early and chase Meghalaya's most stunning falls — Prut Falls,
        Kynrem, Lyngksiar, and Wei Saw Dong, a three-tiered turquoise
        waterfall that looks absolutely unreal. Jump, swim, and play to your
        heart's content.
      stay: Guesthouse, Sohra (Cherrapunji)
      meals:
        - B
      transport: Force Traveller

    - day: 5
      title: Exploring Limestone Caves
      description: >
        Start the day at the Garden of Caves — limestone formations, natural
        pools, and shaded trails that make you forget your phone exists. After
        lunch, head to Shillong for the final two nights. The evening is free
        for wandering the market, souvenir shopping at Police Bazaar, and
        dinner at a local joint.
      stay: Hotel, Shillong
      meals:
        - B
      transport: Force Traveller

    - day: 6
      title: Turquoise Waters & Forested Falls
      description: >
        Start early and travel north to Phe Phe Falls and Krang Suri Falls —
        two dreamy, crystal-clear turquoise waterfalls surrounded by dense
        green jungle. Return to Shillong by night, tired but glowing.
      stay: Hotel, Shillong
      meals:
        - B
      transport: Force Traveller

    - day: 7
      title: Mawphlang Sacred Forest & Departure
      description: >
        On the way back to Guwahati, visit the Mawphlang Sacred Forest — an
        ancient grove with fascinating Khasi tribal stories. You may not
        remove any leaf, flower, or natural object from the forest. After a
        guided walk and lunch, begin the return journey to Guwahati, arriving
        by 7 PM.
      stay: ""
      meals:
        - B
      transport: Force Traveller to Guwahati

  highlights:
    - Stay at Meghalaya's best-kept secret — a serene lake town tucked into green rolling hills
    - Cliff jump, kayak, and river canyon in the monsoon wilderness of Mawlyngbna
    - Camp in tents by the jungle
    - Explore Split Rock, a surreal geological crack-in-the-earth experience
    - Chase waterfalls — Krang Suri, Phe Phe, Kynrem, Wei Saw Dong, and more
    - Walk through the legendary Mawphlang Sacred Forest
    - Hike to a three-tiered turquoise waterfall that looks absolutely unreal
    - Trail through the Garden of Caves — natural pools, limestone formations, and jungle paths

