- name: Monsoon Meghalaya
  slug: monsoon-meghalaya
  location: Meghalaya
  duration: 7 Days, 6 Nights
  featuredImage: ""

  shortDescription: A 7-day monsoon escape through misty meadows, jungle canyons, and turquoise waterfalls.

  description: >
    This monsoon, we're heading into the heart of Meghalaya — a place where
    clouds hang low, forests whisper stories, and waterfalls roar to life.
    Think cliff jumps, bamboo sky bridges, hidden hill towns, river canyons,
    and dreamy turquoise pools.

    This isn't your typical vacation. It's a backpacking-style,
    monsoon-powered adventure through both iconic and lesser-known gems of
    Meghalaya — carefully designed to give you raw, real, and unforgettable
    experiences. We'll be staying in simple but beautiful accommodations,
    from jungle tents to cozy hill cottages, all clean, comfortable, and
    nestled in nature.

    Ankit — our trusted local explorer and friend who knows these lands inside
    out — will also be joining us on this journey. With him by our side,
    you'll experience Meghalaya through the eyes of someone who's lived its
    stories.

    Whether you're craving stillness in the hills or thrill in the rivers —
    this one's for you.

  whoShouldJoin: >
    Anyone craving a raw monsoon adventure — whether you're after stillness
    in the hills or adrenaline in the rivers.

  paymentAmount: 10000
