highlights:
  - Cross the 13,700 ft Sela Pass and Sela Lake
  - Tawang Monastery and the giant Buddha statue
  - Bumla Pass and Sangetsar Lake near the Indo-China frontier
  - Jang Falls on the road to Tawang
  - New Year's Eve bonfire by the river in Sangti Valley
