location: Arunachal Pradesh
duration: 7 Days, 6 Nights
seoTitle: "The Last Frontier: New Year's in Arunachal | 6N/7D"
seoDescription: A 6N/7D New Year's journey across Arunachal — Dirang, Sela Pass, Tawang, Bumla and Sangti Valley — ringing in the new year by the river. Hosted by Seek the Thrill.
imageAlt: High passes and monasteries of Arunachal on a New Year's small-group trip
shortDescription: Sela Pass, Tawang, Bumla and a New Year's Eve bonfire in Sangti Valley — 6N/7D through Arunachal with Zahra and Ankit.
description: >-
  A 6 night, 7 day New Year's journey through Arunachal Pradesh — from the Dirang valley over
  the 13,700 ft Sela Pass into Tawang, up to the Indo-China frontier at Bumla and Sangetsar Lake,
  past Jang Falls, and into the Sangti Valley to ring in the new year by the river. Hosted by
  Zahra (Founder, Seek the Thrill) and Ankit. Only 13 curated slots.
whoShouldJoin: >-
  Travellers chasing high-altitude landscapes, Buddhist monasteries and a small-group New Year's
  away from the crowds. Comfortable with long mountain drives and cold, thin-air days. Beginners welcome.
