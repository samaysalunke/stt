highlights:
  - Khardung La — one of the highest motorable roads in the world
  - Turtuk — a culturally unique border village with Balti culture
  - Thang — last village of India near the LOC
  - Hunder sand dunes and double-humped Bactrian camels
  - Scenic Shyok Valley drive to Pangong Lake
  - Stay at quieter Merak village on Pangong
  - Hanle — remote landscapes and stargazing in India's darkest skies
  - Tso Moriri — one of Ladakh's most pristine high-altitude lakes
  - Chumathang hot water springs on the return
itinerary:
  - day: 1
    title: Arrival in Leh
    description: Arrive in Leh. Check in and rest to acclimatise to the altitude.
      Relaxed evening walk around Leh market if comfortable.
    stay: Hotel, Leh
    meals:
      - D
  - day: 2
    title: Leh Local Sightseeing
    description: Visit Hall of Fame, Gurudwara Patthar Sahib, and Sangam
      (Indus-Zanskar confluence). Shanti Stupa for sunset views.
    stay: Hotel, Leh
    meals:
      - B
      - D
  - day: 3
    title: Leh to Turtuk via Khardung La
    description: Cross Khardung La into Nubra Valley, then continue to Turtuk — one
      of India's northernmost villages with unique Balti culture.
    stay: Homestay, Turtuk
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 4
    title: Thang Village & Hunder
    description: Visit Thang — last village near the India-Pakistan border. Drive
      back to Hunder. Evening at the sand dunes with optional camel rides.
    stay: Camp/Guesthouse, Hunder
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 5
    title: Hunder to Pangong via Shyok Valley
    description: Scenic drive through the Shyok Valley to the quieter Merak side of
      Pangong Lake. Evening by the lake.
    stay: Camp, Merak (Pangong)
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 6
    title: Merak to Hanle
    description: Drive to one of Ladakh's most remote regions — Hanle, known for its
      observatory and incredibly clear night skies.
    stay: Homestay, Hanle
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 7
    title: Hanle to Tso Moriri
    description: Drive to Tso Moriri — one of the most pristine high-altitude lakes
      in Ladakh. Raw landscapes and peaceful surroundings.
    stay: Camp/Guesthouse, Tso Moriri
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 8
    title: Tso Moriri to Leh via Chumathang
    description: Drive back to Leh, stopping at Chumathang hot water springs on the
      way. Arrive by evening.
    stay: Hotel, Leh
    meals:
      - B
      - D
    transport: Private vehicle
  - day: 9
    title: Departure
    description: Breakfast and departure from Leh.
    stay: ""
    meals:
      - B
