description: >
  You'll raft 16 kilometres of Grade III and IV rapids, jump off a cliff into the Ganges (if that's your thing), and camp on a beach by one of the most sacred rivers in the world. Rishikesh rewards people who actually show up — the city is loud, the river is louder, and somehow it all makes sense by day three.
