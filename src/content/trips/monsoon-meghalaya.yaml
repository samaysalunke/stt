duration: 7 Days, 6 Nights
coverImage: ""
description: >
  A backpacking-style, monsoon-powered adventure through both iconic and
  lesser-known gems of Meghalaya. Cliff jumps, bamboo sky bridges, hidden hill
  towns, river canyons, and dreamy turquoise pools. From jungle tents to cozy
  hill cottages — all clean, comfortable, and nestled in nature. Joined by
  Ankit, a trusted local explorer who knows these lands inside out. Price:
  ₹29,000 per person (triple sharing) or ₹31,000 (double sharing).
shortDescription: Misty meadows, jungle canyons, turquoise waterfalls, and
  monsoon magic through the Abode of Clouds.
whoShouldJoin: Those craving stillness in the hills or thrill in the rivers.
  Beginners and first-timers welcome.
