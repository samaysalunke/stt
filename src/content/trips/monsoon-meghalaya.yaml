highlights:
  - Stay at Meghalaya's best-kept secret — a serene lake town tucked in green
    rolling hills
  - Cliff jump, kayak, and river canyon at Mawlyngbna
  - Jungle camping in tents by the forest
  - Split Rock — a surreal geological cave experience
  - Waterfalls — Krang Suri, Phe Phe, Kynrem, and Wei Saw Dong (three-tiered
    turquoise)
  - Garden of Caves — natural pools, waterfalls, limestone formations
  - Guided walk through the legendary Mawphlang Sacred Forest
  - Souvenir shopping and local food at Police Bazaar, Shillong
itinerary:
  - day: 1
    title: Journey to a Hidden Hill Town
    description: Depart Guwahati at 7 AM. Drive into the misty green hills to a
      serene offbeat village with tiny lakes and rolling meadows. Settle in,
      slow evening by the meadows, bonfire, and homely dinner.
    stay: Homestay, Hidden Hill Town (Meghalaya)
    meals:
      - D
    transport: Force Traveller from Guwahati
  - day: 2
    title: Split Rocks & Jungle Camping
    description: Drive to Mawlyngbna. Hike to the Split Rock — a massive crack in
      the earth you can walk through. Afternoon jungle camping in tents with
      mist rolling in at sunset. Bonfire chats and card games.
    stay: Jungle tent camp, Mawlyngbna
    meals:
      - B
  - day: 3
    title: Cliff Jumps & Canyons
    description: Half-day river canyoning — swimming, cliff jumping, waterfall
      sliding, and kayaking. After lunch, drive to Sohra (Cherrapunji) to rest
      up for a big waterfall day.
    stay: Guesthouse, Sohra/Cherrapunji
    meals:
      - B
  - day: 4
    title: Chasing Waterfalls
    description: Visit Prut Falls, Kynrem, Lyngksiar, and Wei Saw Dong — a
      three-tiered turquoise waterfall that looks absolutely unreal. Jump, swim,
      and play to your heart's content.
    stay: Guesthouse, Sohra/Cherrapunji
    meals:
      - B
  - day: 5
    title: Garden of Caves & Shillong
    description: Explore the Garden of Caves — limestone formations, natural pools,
      shaded trails. Head to Shillong. Evening wandering through the market,
      souvenir shopping at Police Bazaar, dinner at a local food joint.
    stay: Guesthouse, Shillong
    meals:
      - B
  - day: 6
    title: Turquoise Waters & Forested Falls
    description: Early start north to Phe Phe Falls and Krang Suri Falls —
      crystal-clear turquoise water and dense green surroundings. Return to
      Shillong by night.
    stay: Guesthouse, Shillong
    meals:
      - B
  - day: 7
    title: Mawphlang Sacred Forest & Departure
    description: Guided walk through the Mawphlang Sacred Forest — ancient trees,
      tribal stories. Nothing may be taken from the forest. Lunch, then return
      journey to Guwahati, arriving by 7 PM.
    stay: ""
    meals:
      - B
    transport: Force Traveller back to Guwahati
