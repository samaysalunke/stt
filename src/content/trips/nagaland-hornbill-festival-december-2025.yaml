shortDescription: Hornbill Festival, Dzukou Valley, Khonoma and Dzuleke — a culture-and-adventure journey through Nagaland.
description: >-
  A culture-and-adventure journey through Nagaland for the Hornbill Festival,
  combining tribal music, dance and food with an overnight Dzukou Valley trek,
  Khonoma village and time beside the Dzuleke river.
whoShouldJoin: >-
  Travellers interested in local culture, festival experiences, trekking and
  offbeat group travel. The itinerary includes an overnight basecamp stay with
  no electricity or mobile network.
