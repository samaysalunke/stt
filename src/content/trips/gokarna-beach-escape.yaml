description: >
  Four days, four beaches, no agenda except the sea. Gokarna is what Goa used to be — quieter, more real, less performative. You'll beach-hop to places most people don't know exist, watch sunsets that make you forget what day it is, and eat the best seafood of your life around a bonfire.
