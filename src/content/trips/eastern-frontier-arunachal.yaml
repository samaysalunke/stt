meetingPoint: >-
  Guwahati — group departs early morning. Arrive in Guwahati the night before.
importantNotes: >-
  High-altitude trip (up to ~13,700 ft) with long mountain drives and cold nights.
  Carry warm layers and any personal medication. Itinerary may flex with weather and road/permit
  conditions. The Chug Valley fine-dining experience is an optional ₹1,500/person add-on.
itinerary:
  - day: 1
    title: Guwahati to Dirang
    description: Depart Guwahati early. Drive through Bhalukpong and Bomdila into the Dirang valley.
    stay: Dirang
    meals: [D]
    transport: Mountain vehicle from Guwahati
  - day: 2
    title: Dirang & Chug Valley
    description: Explore Dirang — Sangti Valley, hot springs, the old dzong and the hidden hamlet of Chug. Optional fine-dining evening in Chug Valley.
    stay: Dirang
    meals: [B, D]
  - day: 3
    title: Dirang to Tawang over Sela Pass
    description: Climb to the 13,700 ft Sela Pass and its frozen lakes, pay respects at Jaswant Garh, then descend into Tawang.
    stay: Tawang
    meals: [B, D]
    transport: Mountain vehicle
  - day: 4
    title: Tawang Monastery & town
    description: Visit Tawang Monastery, the War Memorial and local markets. Time to slow down at altitude.
    stay: Tawang
    meals: [B, D]
  - day: 5
    title: Bumla Pass & Madhuri Lake
    description: Day excursion to the Indo-China frontier at Bumla Pass, PTSo Lake and the frozen Madhuri (Shonga-tser) Lake. Permit-dependent.
    stay: Tawang
    meals: [B, D]
  - day: 6
    title: Tawang to Dirang/Bomdila
    description: Retrace the high passes back down to the lower valleys for a final mountain night.
    stay: Bomdila / Dirang
    meals: [B, D]
  - day: 7
    title: Drive back to Guwahati
    description: Descend to the plains and transfer to Guwahati for onward journeys.
    stay: ''
    meals: [B]
    transport: Mountain vehicle to Guwahati
