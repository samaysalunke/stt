seoTitle: The Eastern Frontier — Arunachal Pradesh | 6N/7D
seoDescription: A 6N/7D small-group journey across Arunachal's eastern frontier — Dirang, Chug Valley, Sela Pass, Tawang and Bumla — hosted by Seek the Thrill.
imageAlt: Snow-draped monastery and high passes on Arunachal's eastern frontier
shortDescription: Monasteries, snow passes and the Chug Valley — 6N/7D through Arunachal's far east with Zahra and Ankit.
description: >-
  A 6 night, 7 day ride through Arunachal Pradesh's eastern frontier — from the apple-and-kiwi
  valleys of Dirang and the hidden hamlet of Chug, over the 13,700 ft Sela Pass into Tawang, and
  up to the Indo-China frontier at Bumla and the frozen Madhuri Lake. Hosted by Zahra (Founder,
  Seek the Thrill) and Ankit.
whoShouldJoin: >-
  Travellers chasing high-altitude landscapes, Buddhist monasteries and slow mountain culture.
  Comfortable with long drives and cold, thin-air days. Beginners welcome.
