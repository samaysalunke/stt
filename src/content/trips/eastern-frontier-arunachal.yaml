highlights:
  - Cross the 13,700 ft Sela Pass and its frozen high-altitude lakes
  - Tawang Monastery — India's largest, perched above the valley
  - Bumla Pass and Madhuri (Shonga-tser) Lake near the Indo-China frontier
  - The hidden hamlet of Chug Valley and the meadows of Sangti
included:
  - Pick-up and drop from Guwahati
  - All internal travel by mountain vehicle
  - 6N accommodation as per itinerary (homestays/hotels)
  - Daily breakfast and dinner
  - Inner Line Permits for Arunachal Pradesh
  - Trip host(s) throughout
notIncluded:
  - Flights/trains to and from Guwahati
  - Lunches
  - Entry/camera fees at monuments and monasteries
  - Optional Chug Valley fine-dining experience (₹1,500 per person)
