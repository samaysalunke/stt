balanceDueRule: 15 days before trip
highlights:
  - Waterfall rappelling — 200-ft descent, first-timer friendly
  - Secret natural pool hidden in the green hills
  - Offbeat ridge hike with open ridgeline landscapes
  - Evening visit to a majestic waterfall on Day 1
  - Lakeside chill at Bhandardara Lake
  - Waterfall hopping through misty hills on the drive back
  - 3 nights at a lakeside property in Bhandardara
itinerary:
  - day: 1
    title: Depart Mumbai — Arrive Bhandardara
    description: Depart Mumbai at 8 AM in private AC tempo traveller. Arrive by
      early afternoon at the lakeside property. Slow evening — visit a majestic
      waterfall, chill at Bhandardara Lake. Good food, good stories.
    stay: Lakeside property, Bhandardara
    meals:
      - evening snacks
    transport: AC tempo traveller from Mumbai
  - day: 2
    title: Waterfall Rappelling & Natural Pool
    description: 45-min hike to the rappelling site, then 200-ft descent —
      first-timer friendly and a core memory in the making. Local lunch. Wind
      down with a dip in an offbeat hidden natural pool.
    stay: Lakeside property, Bhandardara
    meals:
      - B
      - L
  - day: 3
    title: Offbeat Ridge Hike
    description: Hike along stunning ridgelines and open landscapes. Dip in a
      natural pool in the middle of nowhere. Beginner-friendly but you'll get
      those steps in. Evening relaxing and soaking in the monsoon mood.
    stay: Lakeside property, Bhandardara
    meals:
      - B
      - L
  - day: 4
    title: Waterfall Hopping & Return to Mumbai
    description: Slow last morning in the countryside. Waterfall hopping through
      misty hills on the drive back — windows down, fresh air, monsoon magic.
      Depart post-lunch. Arrive Mumbai around 10 PM.
    stay: ""
    meals:
      - B
    transport: AC tempo traveller back to Mumbai
included:
  - AC private tempo traveller from Mumbai and back
  - All local transport
  - 3 nights stay at a lakeside property (dorm or double sharing cottage)
  - Breakfast on all days (Sat–Mon) + local style lunch on Sat & Sun + evening
    snacks
  - All experiences — guided hike, waterfall rappelling, natural pools,
    waterfall hopping
excluded:
  - Meals not mentioned in inclusions
  - Personal expenses or additional activities
  - Anything not listed under inclusions
paymentAmount: 10000
meetingPoint: Mumbai — departure point shared with the group on booking. 8:00 AM sharp.
importantNotes: |
  - Monsoon-friendly itinerary — nature will do its thing.
  - Safety is top priority; rain or shine, the spirit of the trip comes through.
  - Double sharing cottages are limited and allocated first-come.
  - Advance of ₹10,000 is non-refundable.
  - Minimum 8 people to confirm the trip.
