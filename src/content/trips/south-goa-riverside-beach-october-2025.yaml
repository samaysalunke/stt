highlights:
  - Riverside picnic with cliff jumping and local feni cocktails or mocktails
  - Sunset kayaking through Goa's tranquil backwaters
  - Waterfall hikes surrounded by lush greenery
  - Barbecue, bonfire and an outdoor movie night under the stars
  - Village circuit hilltop hike with panoramic views
  - Beach evenings, shack dinners and local Goan experiences
  - A flexible final day for scooters, cycles, shopping or quiet beach time
itinerary:
  - day: 0
    title: Overnight departure from Bangalore
    description: >-
      Meet in Bangalore and depart at approximately 8 PM by Tempo Traveller for
      the overnight journey to South Goa.
    stay: Overnight journey
    meals: []
    transport: Tempo Traveller from Bangalore
  - day: 1
    title: Riverside picnic, cliff jumping and sunset kayaking
    description: >-
      Arrive at the riverside campsite at approximately 10 AM and settle in.
      Spend the day at a riverside picnic with cliff jumping, lunch and local
      feni cocktails or mocktails. Go sunset kayaking before dinner at a nearby
      beach shack.
    stay: Riverside campsite, South Goa
    meals: [L]
    transport: Local transfers
  - day: 2
    title: Waterfall hikes and movie night
    description: >-
      Spend the day hiking to waterfalls through lush surroundings. Return to
      the campsite for a relaxed evening with a barbecue, bonfire and outdoor
      movie under the stars.
    stay: Riverside campsite, South Goa
    meals: [B, L, D]
    transport: Local transfers
  - day: 3
    title: Village circuit hike and beach evening
    description: >-
      Start early for a four-to-five-hour village circuit hilltop hike with
      panoramic views and offbeat trails. Return to camp, then head to the beach
      for the evening and have dinner at a beach shack.
    stay: Riverside campsite, South Goa
    meals: [B]
    transport: Local transfers
  - day: 4
    title: Explore at your own pace and return
    description: >-
      Keep the final day flexible: rent a scooter or cycle, explore the
      countryside, relax at the beach, shop or follow the group's energy. Have a
      farewell lunch and depart Goa at approximately 6 PM, reaching Bangalore
      around 6 AM the following morning.
    stay: Overnight journey
    meals: [B]
    transport: Tempo Traveller to Bangalore for the Bangalore package
included:
  - Three nights at a riverside campsite in comfortable double-sharing tents with mattresses and washrooms
  - Bangalore return transport by Tempo Traveller for the Bangalore package
  - Internal transport mentioned in the itinerary
  - Daily breakfast
  - Riverside picnic lunch on Day 1 and waterfall-hike lunch on Day 2
  - Barbecue dinner
  - Sunset kayaking and riverside cliff jumping
  - Bonfire and outdoor movie night
  - Guided village circuit hilltop hike
excluded:
