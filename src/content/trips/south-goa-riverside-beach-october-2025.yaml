imageAlt: Travellers exploring the rivers, waterfalls and beaches of South Goa
shortDescription: Riverside camping, cliff jumping, sunset kayaking, waterfall hikes and relaxed beach time in South Goa.
description: >-
  A four-day adventure-and-chill escape through South Goa, combining a
  riverside campsite with cliff jumping, kayaking, waterfall and hilltop hikes,
  beach evenings and time to explore the countryside at an unhurried pace.
whoShouldJoin: >-
  Travellers looking for a mix of outdoor adventure, local Goan culture and
  relaxed beach time. The itinerary included several hikes, cliff jumping and
  kayaking alongside slower, flexible experiences.
