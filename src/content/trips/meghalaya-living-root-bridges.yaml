duration: 6 Days, 5 Nights
highlights:
  - Trek to the Double Decker Living Root Bridge
  - Swim in naturally blue Umngot River at Dawki
  - Drive through the cloud-kissed roads of Cherrapunji
  - Village stays in Nongriat
  - Nohkalikai Falls — India's tallest plunge waterfall
  - Mawsmai Caves exploration
itinerary:
  - day: 1
    title: Fly to Shillong — Arrival
    description: Flights into Guwahati or Shillong. Group pickup and drive to Shillong. Evening walk through Police Bazar. Welcome dinner.
    stay: Guesthouse, Shillong
    meals: [D]
    transport: Flight + private cab
  - day: 2
    title: Shillong to Cherrapunji
    description: Drive to Cherrapunji — one of the rainiest places on earth. Visit Nohkalikai Falls, Mawsmai Caves, and Seven Sisters Falls. Afternoon free to soak in the mist.
    stay: Guesthouse, Cherrapunji
    meals: [B, L, D]
    transport: Private cab
  - day: 3
    title: Trek to Living Root Bridges
    description: 3,500 steps down to Nongriat village. Trek to the Double Decker Living Root Bridge. Swim in clear mountain streams. Overnight in the village.
    stay: Homestay, Nongriat village
    meals: [B, L, D]
    transport: On foot
    note: This is a demanding day — 3,500 steps down and back up. Worth every one of them.
  - day: 4
    title: Back to Cherrapunji + Dawki
    description: Morning at leisure in Nongriat. Trek back up. Drive to Dawki on the Bangladesh border — the river here is so clear you can see the bottom from a boat.
    stay: Guesthouse, Dawki
    meals: [B, L, D]
    transport: On foot + private cab
  - day: 5
    title: Dawki to Shillong — Mawlynnong
    description: Morning boat ride on Umngot River. Drive through Mawlynnong — the cleanest village in Asia. Back to Shillong by evening.
    stay: Guesthouse, Shillong
    meals: [B, L, D]
    transport: Private cab
  - day: 6
    title: Shillong — Departure
    description: Morning free to explore. Checkout. Transfers to airport for return flights.
    stay: ""
    meals: [B]
    transport: Private cab to airport
