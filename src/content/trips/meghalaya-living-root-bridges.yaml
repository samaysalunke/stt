title: Meghalaya — Living Root Bridges
slug: meghalaya-living-root-bridges
location: Meghalaya
status: upcoming
description: >
  Meghalaya is the wettest place on earth, and somehow that's exactly the point. The living root bridges in Nongriat are built by growing fig tree roots across rivers — some of them are 500 years old. You'll walk through clouds, wade through streams, and spend nights in villages where electricity arrived within living memory.
