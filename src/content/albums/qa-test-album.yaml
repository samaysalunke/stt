# Fixture album. `qa-test-` prefixed content is skipped by scripts/copy-seed.js,
# so this never reaches the production volume — the same convention the
# qa-test-* trips use. It exists because GLightbox had no runtime coverage at
# all: src/content/albums/ was empty in this checkout, so no album rendered and
# no lightbox could be opened.
#
# `publicationStatus: published` rather than `test`: isAlbumPublic() only
# accepts published/archived, and a draft album 404s before the lightbox script
# ever loads.
name: QA Test Album
publicationStatus: published
location: Meghalaya
date: 2026-05-18
description: Fixture album used by the photo-vault lightbox test.
seoTitle: QA Test Album
seoDescription: Fixture album used by the photo-vault lightbox test.
socialImageAlt: Fixture photograph
