<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #FDF0EC; }
        .input-focus:focus-within { border-color: #E8725A; box-shadow: 0 0 0 4px rgba(232, 114, 90, 0.1); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coral: '#E8725A',
                        'dark-coral': '#D95F3B',
                        blush: '#FDF0EC',
                        navy: '#1B2B3A',
                        peach: '#F5DDD7',
                        'gray-soft': '#F5F5F3',
                    },
                    fontFamily: {
                        fraunces: ['Fraunces', 'serif'],
                        dm: ['DM Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-dm text-navy antialiased min-h-[840px] flex flex-col items-center justify-center">

    <main id="login-container" class="w-full max-w-[375px] px-8 py-12 flex flex-col justify-center min-h-[840px]">
        
        <!-- 1. Brand Identity & Header -->
        <section id="brand-header" class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-[2rem] shadow-xl shadow-coral/10 mb-8 border border-peach/30">
                <i class="fa-solid fa-compass text-coral text-4xl"></i>
            </div>
            <h1 class="font-fraunces font-900 text-3xl text-navy mb-3">Admin Portal</h1>
            <p class="text-navy/50 text-sm font-500">Welcome back, Zahra. Manage your offbeat journeys effortlessly.</p>
        </section>

        <!-- 2. Authentication Form -->
        <section id="auth-form" class="space-y-5">
            <div class="space-y-2">
                <label class="text-[10px] font-700 text-navy/40 uppercase tracking-widest ml-1">Admin Email</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-navy/30 group-focus-within:text-coral transition-colors"></i>
                    </div>
                    <input type="email" placeholder="zahra@traveldashboard.com" 
                        class="w-full bg-white border border-peach/50 rounded-2xl py-4 pl-11 pr-4 text-sm font-600 focus:outline-none transition-all input-focus"
                        value="zahra@traveldashboard.com">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-700 text-navy/40 uppercase tracking-widest ml-1">Security Key</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-navy/30 group-focus-within:text-coral transition-colors"></i>
                    </div>
                    <input type="password" placeholder="••••••••" 
                        class="w-full bg-white border border-peach/50 rounded-2xl py-4 pl-11 pr-12 text-sm font-600 focus:outline-none transition-all input-focus">
                    <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-navy/30 hover:text-coral">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between py-2">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative flex items-center">
                        <input type="checkbox" checked class="peer sr-only">
                        <div class="w-5 h-5 bg-white border-2 border-peach rounded-md peer-checked:bg-coral peer-checked:border-coral transition-all"></div>
                        <i class="fa-solid fa-check absolute text-white text-[10px] left-1 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                    </div>
                    <span class="text-xs font-600 text-navy/60 group-hover:text-navy transition-colors">Remember me</span>
                </label>
                <a href="#" class="text-xs font-700 text-coral hover:text-dark-coral transition-colors">Forgot Access?</a>
            </div>

            <button id="login-btn" class="w-full bg-navy text-white py-4 rounded-2xl font-700 text-sm shadow-xl shadow-navy/20 flex items-center justify-center gap-3 transition-transform active:scale-[0.98] mt-4">
                Enter Dashboard
                <i class="fa-solid fa-arrow-right-long text-xs"></i>
            </button>
        </section>

        <!-- 3. Quick Support / System Status -->
        <section id="system-status" class="mt-12">
            <div class="bg-white/50 border border-peach/30 rounded-3xl p-4 flex items-center gap-4">
                <div class="relative">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div>
                    <h4 class="text-[10px] font-700 text-navy/40 uppercase tracking-widest">System Status</h4>
                    <p class="text-xs font-600 text-navy/70">Secure Connection Verified</p>
                </div>
            </div>
        </section>

        <!-- 4. Footer Help -->
        <footer id="footer" class="mt-auto pt-10 text-center">
            <p class="text-[10px] font-600 text-navy/30 uppercase tracking-[0.2em] mb-4">Internal Admin Access Only</p>
            <div class="flex justify-center gap-6">
                <a href="#" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-navy/40 hover:text-coral transition-colors shadow-sm">
                    <i class="fa-solid fa-circle-question"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-navy/40 hover:text-coral transition-colors shadow-sm">
                    <i class="fa-solid fa-life-ring"></i>
                </a>
            </div>
        </footer>

    </main>

    <script>
        // Simple interaction for the login button
        document.getElementById('login-btn').addEventListener('click', function() {
            this.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authorizing...';
            this.classList.add('opacity-80');
            
            // Simulation of redirect
            setTimeout(() => {
                // In a real app, this would navigate to the dashboard
                console.log('Redirecting to dashboard...');
            }, 1500);
        });

        // Simple checkbox toggle logic for visual feedback
        const checkbox = document.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', function() {
            const box = this.nextElementSibling;
            if(this.checked) {
                box.classList.add('bg-coral', 'border-coral');
            } else {
                box.classList.remove('bg-coral', 'border-coral');
            }
        });
    </script>
</body>
</html>
